import java.nio.charset.StandardCharsets
import java.util.Locale

plugins {
    id 'application'
    id 'org.graalvm.buildtools.native' version '1.1.6'
    id 'maven-publish'
    id 'com.gradleup.shadow' version '9.3.1'
    id 'signing'
    id "io.github.gradle-nexus.publish-plugin" version "2.0.0"
    id 'org.jreleaser' version '1.25.0'
}

group = 'io.github.sogis'

version '0.0.11'+System.getProperty('release','-SNAPSHOT')

def myArtifactId = "dmav"

compileJava {
    options.compilerArgs.addAll(['--release', '11'])
}

repositories {
    mavenCentral()
    maven { url 'https://jars.interlis.ch/' }
}

dependencies {
    testImplementation libs.junit.jupiter
    testImplementation "ch.interlis:ilivalidator:1.14.5"
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation 'info.picocli:picocli:4.7.6'
    annotationProcessor 'info.picocli:picocli-codegen:4.7.6'

    implementation 'ch.interlis:iox-ili:1.24.4'
    implementation 'ch.interlis:ili2c-tool:5.6.8'
    implementation 'ch.interlis:ili2c-core:5.6.8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

def nativeJavaLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(25)
    vendor = JvmVendorSpec.matching('GraalVM Community')
}

def nativeImageExecutable = nativeJavaLauncher.map { launcher ->
    File binDirectory = launcher.metadata.installationPath.asFile.toPath().resolve('bin').toFile()
    boolean windows = System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')
    List<File> candidates = windows
            ? [new File(binDirectory, 'native-image.cmd'),
               new File(binDirectory, 'native-image.exe'),
               new File(binDirectory, 'native-image')]
            : [new File(binDirectory, 'native-image')]
    File executable = candidates.find { it.isFile() }
    if (executable == null) {
        throw new GradleException("No native-image executable found below ${binDirectory}")
    }
    executable
}

def nativeGcArgument = nativeImageExecutable.map { File executable ->
    try {
        List<String> helpCommand = executable.name.toLowerCase(Locale.ROOT).endsWith('.cmd')
                ? ['cmd.exe', '/c', executable.absolutePath, '--help']
                : [executable.absolutePath, '--help']
        Process helpProcess = new ProcessBuilder(helpCommand)
                .redirectErrorStream(true)
                .start()
        String help = new String(helpProcess.inputStream.bytes, StandardCharsets.UTF_8)
        int exitCode = helpProcess.waitFor()
        String gc = exitCode == 0 && help.contains("'G1'") ? 'G1' : 'serial'
        logger.lifecycle("Native Image GC: ${gc}")
        "--gc=${gc}"
    } catch (Exception exception) {
        logger.lifecycle("Native Image GC probe failed; using serial GC: ${exception.message}")
        '--gc=serial'
    }
}

graalvmNative {
    binaries {
        named('main') {
            imageName.set('dmav')
            mainClass.set(application.mainClass)
            javaLauncher.set(nativeJavaLauncher)
            buildArgs.add(nativeGcArgument)
            buildArgs.add('-H:+ReportExceptionStackTraces')
        }
    }
}

application {
    mainClass = 'ch.so.agi.dmav.App'
}

tasks.named('test') {
    useJUnitPlatform()
}

run {
    //args = ["--help"]
    args = ["merge", "--config=myconfigAAAAA.ini", "--fosnr=449", "--out=/Users/stefan/tmp"]
}

task sourcesJar(type: Jar, dependsOn: classes) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

javadoc.failOnError = false
task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifact sourcesJar
            artifact javadocJar

            pom {
                name = "dmav"
                url = "https://github.com/sogis/dmav"
                description = "dmav"
                scm {
                    connection = "scm:git:https@github.com/sogis/dmav"
                    developerConnection = "scm:git:https@github.com/sogis/dmav"
                    url = "https://github.com/sogis/dmav"
                }
                licenses {
                    license {
                        name = "MIT"
                        url = "https://github.com/sogis/dmav/blob/master/LICENSE"
                    }
                }
                developers {
                    developer {
                        id = "edigonzales"
                        name = "Stefan Ziegler"
                    }
                }
            }
        }
    }
}

if (!version.toString().endsWith("SNAPSHOT")) {
    signing {
        sign publishing.publications.mavenJava
    }
}

nexusPublishing {
    repositories {
        sonatype {
            nexusUrl.set(uri("https://s01.oss.sonatype.org/service/local/"))
            snapshotRepositoryUrl.set(uri("https://s01.oss.sonatype.org/content/repositories/snapshots/"))
            username = findProperty("ossrhUsername") ?: System.getenv("OSSRH_USERNAME")
            password = findProperty("ossrhPassword") ?: System.getenv("OSSRH_PASSWORD")
        }
    }
}

jreleaser {
    gitRootSearch = true

    project {
        name = myArtifactId
        description = 'Werkzeugkasten für das Handling mit DMAV-Transferdateien.'
        website = 'https://agi.so.ch'
        authors = ['edigonzales']
        license = 'MIT'
        docsUrl = 'https://github.com/sogis/dmav'
        copyright = '2024 Stefan Ziegler'
    }
    release {
        github {
            repoOwner = 'sogis'
            overwrite = true
            apiEndpoint = 'https://api.github.com'
        }
    }
    distributions {
        appJvm {
            distributionType = 'SINGLE_JAR'
            stereotype = 'CLI'
            artifact {
                path = "build/libs/dmav-${version}-all.jar"
            }
            java {
                groupId = 'io.github.sogis'
                artifactId = myArtifactId
                version = '11'
            }
        }

        appNative {
            active = 'RELEASE'
            distributionType = 'FLAT-BINARY'
            stereotype = 'CLI'

            artifact {
                path = 'build/native-releases/dmav-linux-x86_64'
                platform = 'linux-x86_64'
            }
            artifact {
                path = 'build/native-releases/dmav-windows-x86_64.exe'
                platform = 'windows-x86_64'
            }
            artifact {
                path = 'build/native-releases/dmav-osx-aarch_64'
                platform = 'osx-aarch_64'
            }
        }
    }
}
