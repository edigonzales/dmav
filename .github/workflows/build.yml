name: build and release

on: 
  push:
    paths-ignore:
      - '**.md'
      - dev/**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 for Gradle
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Build with Gradle (SNAPSHOT)
        if: ${{ success() && github.ref == 'refs/heads/main'}}
        id: buildSnapshotLib
        run: ./gradlew clean build sourcesJar javadocJar 

      - name: Build with Gradle (RELEASE)
        if: ${{ success() && github.ref == 'refs/heads/stable'}}
        id: buildReleaseLib
        run: ./gradlew clean build sourcesJar javadocJar -Drelease= 

      - name: Debug 1
        run: |
          ls -la build/libs

      - uses: actions/upload-artifact@v4
        if: always() && (steps.buildSnapshotLib.outcome == 'failure' || steps.buildReleaseLib.outcome == 'failure')
        with:
          name: reports
          path: build/reports/tests/

      - name: Upload JVM release artifact
        if: ${{ github.ref == 'refs/heads/stable' && steps.buildReleaseLib.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: jvm-release
          path: build/libs/dmav-*-all.jar
          if-no-files-found: error

      # - name: Decode
      #   if: always() && (steps.buildSnapshotLib.outcome == 'success' || steps.buildReleaseLib.outcome == 'success')
      #   run: |
      #     echo "${{secrets.SIGNING_SECRET_KEY_RING_FILE}}" > ~/.gradle/sonatype_upload.gpg.b64
      #     base64 -d ~/.gradle/sonatype_upload.gpg.b64 > ~/.gradle/sonatype_upload.gpg

      # - name: Publish library jar file (SNAPSHOT)
      #   if: ${{ success() && (github.ref == 'refs/heads/main')}}
      #   run: ./gradlew -i publishToSonatype closeAndReleaseSonatypeStagingRepository -Psigning.keyId=${{secrets.SIGNING_KEY_ID}} -Psigning.password=${{secrets.SIGNING_PASSWORD}} -Psigning.secretKeyRingFile=$(echo ~/.gradle/sonatype_upload.gpg)
      #   env:
      #     OSSRH_USERNAME: ${{secrets.OSSRH_USERNAME}}
      #     OSSRH_PASSWORD: ${{secrets.OSSRH_PASSWORD}} 

      # - name: Publish library jar file (RELEASE)
      #   if: ${{ success() && (github.ref == 'refs/heads/stable')}}
      #   run: ./gradlew -i publishToSonatype closeAndReleaseSonatypeStagingRepository -Psigning.keyId=${{secrets.SIGNING_KEY_ID}} -Psigning.password=${{secrets.SIGNING_PASSWORD}} -Psigning.secretKeyRingFile=$(echo ~/.gradle/sonatype_upload.gpg) -Drelease=
      #   env:
      #     OSSRH_USERNAME: ${{secrets.OSSRH_USERNAME}}
      #     OSSRH_PASSWORD: ${{secrets.OSSRH_PASSWORD}} 

  native:
    name: native-${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
            executable: dmav
            asset: dmav-linux-x86_64
          - target: windows-x86_64
            runner: windows-latest
            executable: dmav.exe
            asset: dmav-windows-x86_64.exe
          - target: osx-aarch_64
            runner: macos-14
            executable: dmav
            asset: dmav-osx-aarch_64

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21 for Gradle
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up GraalVM Community JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          set-java-home: 'false'

      - name: Build native image
        shell: bash
        run: ./gradlew nativeCompile

      - name: Smoke-test native image
        shell: bash
        run: build/native/nativeCompile/${{ matrix.executable }} --help

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p build/native-releases
          cp "build/native/nativeCompile/${{ matrix.executable }}" "build/native-releases/${{ matrix.asset }}"

      - name: Upload native image
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.target }}
          path: build/native-releases/${{ matrix.asset }}
          if-no-files-found: error

      - name: Upload native build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-report-${{ matrix.target }}
          path: build/reports/native/
          if-no-files-found: ignore

  release:
    name: release
    if: ${{ github.ref == 'refs/heads/stable' }}
    needs:
      - build
      - native
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 for Gradle
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Download native images
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: build/native-releases
          merge-multiple: true

      - name: Download JVM release artifact
        uses: actions/download-artifact@v4
        with:
          name: jvm-release
          path: build/libs

      - name: Show release assets
        run: ls -la build/native-releases

      - name: Release library and native images
        run: ./gradlew -s jreleaserRelease -Drelease=
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
